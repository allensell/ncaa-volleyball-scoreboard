<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volleyball Scoreboard</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0a0a1a;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      text-align: center;
      padding: 16px 24px 0;
      flex-shrink: 0;
    }
    header h1 {
      font-size: 1.8rem;
      letter-spacing: 2px;
      color: #ffffff;
      text-transform: uppercase;
    }
    #clock       { font-size: 0.9rem;  color: #aaa; margin-top: 4px; }
    #week-label  { font-size: 0.75rem; color: #666; margin-top: 2px; }
    #refresh-bar { font-size: 0.72rem; color: #555; margin-top: 2px; }

    /* ── Tab bar ── */
    .tab-bar {
      display: flex;
      gap: 0;
      padding: 14px 24px 0;
      border-bottom: 2px solid #1e1e3a;
      flex-shrink: 0;
    }
    .tab-btn {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      padding: 8px 28px;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #555;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab-btn:hover { color: #aaa; }
    .tab-btn.active-mens   { color: #7eb3ff; border-bottom-color: #3a7bd5; }
    .tab-btn.active-womens { color: #ff9de0; border-bottom-color: #c43aab; }

    /* ── Tab panels ── */
    /* min-height:0 is required — flex children default to min-height:auto
       which prevents them from shrinking to allow inner overflow scrolling */
    .tab-panel { display: none; flex: 1; min-height: 0; overflow: hidden; }
    .tab-panel.active { display: flex; flex-direction: column; }

    /* ── Men's panel: single scrollable column ── */
    #panel-mens {
      padding: 16px 24px 24px;
      overflow-y: auto;
      min-height: 0;
    }

    /* ── Women's panel: three fixed-height columns ── */
    #panel-womens {
      flex-direction: row;
      gap: 0;
      overflow: hidden;
      min-height: 0;
    }

    .womens-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;   /* allows col to shrink so col-scroll can overflow */
      overflow: hidden;
      border-right: 1px solid #1a1a2e;
    }
    .womens-col:last-child { border-right: none; }

    .col-header {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 10px 20px;
      flex-shrink: 0;  /* header never shrinks — stays pinned at top */
      border-bottom: 1px solid #1e1e3a;
    }
    .col-header.upcoming  { color: #f0c040; background: #0e0e1c; }
    .col-header.live      { color: #ff4d4d; background: #140e0e; }
    .col-header.completed { color: #888;    background: #0c0c18; }

    .col-scroll {
      flex: 1;
      min-height: 0;   /* same fix — allows this child to shrink and scroll */
      overflow-y: auto;
      padding: 10px 16px 24px;
    }

    /* ── Date dividers ── */
    .date-divider {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #3a3a6a;
      padding: 12px 2px 4px;
      border-top: 1px solid #1a1a2a;
      margin-top: 4px;
    }
    .date-divider:first-child { border-top: none; margin-top: 0; padding-top: 2px; }
    .date-divider.today { color: #c09020; border-top-color: #2a2a10; }
    .date-divider.today::after {
      content: ' — TODAY';
      font-size: 0.6rem;
      color: #806010;
      letter-spacing: 1.5px;
    }

    /* ── Game cards ── */
    .game-list { display: flex; flex-direction: column; gap: 6px; }

    .game-card {
      background: #14142a;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      padding: 10px 12px;
      transition: background 0.2s;
    }
    .game-card:hover { background: #1c1c38; }

    .game-status {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 7px;
    }
    .status-live  { color: #ff4d4d; }
    .status-final { color: #666; }
    .status-pre   { color: #f0c040; }

    .matchup { display: flex; flex-direction: column; gap: 5px; }

    .team-row { display: flex; align-items: center; gap: 7px; }

    .team-rank {
      font-size: 0.65rem;
      color: #777;
      width: 20px;
      text-align: right;
      flex-shrink: 0;
    }
    .team-logo {
      width: 24px; height: 24px;
      object-fit: contain;
      flex-shrink: 0;
      border-radius: 3px;
      background: #1e1e30;
    }
    .team-logo-placeholder {
      width: 24px; height: 24px;
      background: #222240;
      border-radius: 3px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.5rem; color: #555;
    }
    .team-name {
      flex: 1;
      font-size: 0.85rem;
      font-weight: 600;
      color: #c8c8e8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .team-name.winner { color: #ffffff; }
    .score {
      font-size: 1.05rem;
      font-weight: 800;
      min-width: 28px;
      text-align: right;
      color: #b0b0cc;
    }
    .score.winner   { color: #ffffff; }
    .score.no-score { color: #333; font-size: 0.75rem; }

    /* ── Broadcast badges ── */
    .broadcast-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
    .broadcast-badge {
      font-size: 0.62rem; font-weight: 700;
      padding: 2px 6px;
      border-radius: 3px;
      background: #1e1e3a; border: 1px solid #3a3a6a; color: #90a8f0;
      white-space: nowrap;
    }
    .broadcast-badge.tv     { background:#182818; border-color:#385038; color:#70c070; }
    .broadcast-badge.stream { background:#181828; border-color:#403060; color:#b070f0; }

    .game-detail { font-size: 0.67rem; color: #484860; margin-top: 5px; }

    /* ── Empty / error states ── */
    .no-games {
      padding: 24px 8px;
      text-align: center;
      color: #383860;
      font-size: 0.85rem;
    }
    .error-msg {
      background: #2a1010; border: 1px solid #5a2020;
      border-radius: 8px; padding: 12px;
      color: #ff8080; font-size: 0.8rem; text-align: center;
    }
    .spinner { padding: 32px; text-align: center; color: #383860; font-size: 0.85rem; }

    /* ── Responsive ── */
    @media (max-width: 700px) {
      #panel-womens { flex-direction: column; }
      .womens-col { border-right: none; border-bottom: 1px solid #1a1a2e; }
      .womens-col:last-child { border-bottom: none; }
      header h1 { font-size: 1.3rem; }
      .tab-btn { padding: 8px 16px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>NCAA Volleyball Scoreboard</h1>
  <div id="clock"></div>
  <div id="week-label"></div>
  <div id="refresh-bar">Loading…</div>
</header>

<!-- ── Tab bar ── -->
<div class="tab-bar">
  <button class="tab-btn active-mens" id="tab-mens"   onclick="showTab('mens')">&#9651; Men's</button>
  <button class="tab-btn"             id="tab-womens" onclick="showTab('womens')">&#9651; Women's</button>
</div>

<!-- ── Men's panel ── -->
<div class="tab-panel active" id="panel-mens">
  <div class="game-list" id="mens-games"><div class="spinner">Loading…</div></div>
</div>

<!-- ── Women's panel ── -->
<div class="tab-panel" id="panel-womens">
  <div class="womens-col">
    <div class="col-header upcoming">&#9654; Upcoming</div>
    <div class="col-scroll">
      <div class="game-list" id="womens-upcoming"><div class="spinner">Loading…</div></div>
    </div>
  </div>
  <div class="womens-col">
    <div class="col-header live">&#9679; Live</div>
    <div class="col-scroll">
      <div class="game-list" id="womens-live"><div class="spinner">Loading…</div></div>
    </div>
  </div>
  <div class="womens-col">
    <div class="col-header completed">&#10003; Completed</div>
    <div class="col-scroll">
      <div class="game-list" id="womens-completed"><div class="spinner">Loading…</div></div>
    </div>
  </div>
</div>

<script>
  const BASE = 'https://site.api.espn.com/apis/site/v2/sports/volleyball';

  // ── Tab switching ──────────────────────────────────────────────────────
  function showTab(which) {
    document.getElementById('panel-mens').classList.toggle('active', which === 'mens');
    document.getElementById('panel-womens').classList.toggle('active', which === 'womens');
    document.getElementById('tab-mens').className   = 'tab-btn' + (which === 'mens'   ? ' active-mens'   : '');
    document.getElementById('tab-womens').className = 'tab-btn' + (which === 'womens' ? ' active-womens' : '');
  }

  // ── Clock ──────────────────────────────────────────────────────────────
  function updateClock() {
    const now = new Date();
    const et = now.toLocaleTimeString('en-US', {
      timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true
    });
    const date = now.toLocaleDateString('en-US', {
      timeZone: 'America/New_York', weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
    });
    document.getElementById('clock').textContent = `${date}  ·  ${et} ET`;

    const days = weekDatesET();
    const fmt = d => new Date(d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6)+'T12:00:00')
      .toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    document.getElementById('week-label').textContent =
      `Week of ${fmt(days[0])} – ${fmt(days[6])}`;
  }

  // ── Date helpers ───────────────────────────────────────────────────────
  function todayET() {
    return new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
  }
  function dateET(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
  }
  function formatTimeET(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleTimeString('en-US', {
      timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit', hour12: true
    }) + ' ET';
  }

  // Mon–Sun of current week as YYYYMMDD strings
  function weekDatesET() {
    const todayStr = todayET();
    const base = new Date(todayStr + 'T12:00:00');
    const dow = base.getDay();
    const monday = new Date(base);
    monday.setDate(base.getDate() - (dow === 0 ? 6 : dow - 1));
    return Array.from({ length: 7 }, (_, i) => {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      return d.toLocaleDateString('en-CA').replace(/-/g, '');
    });
  }

  // ── Status label ───────────────────────────────────────────────────────
  function statusLabel(event) {
    const state = event?.status?.type?.state || '';
    const desc  = event?.status?.type?.shortDetail || event?.status?.type?.description || '';
    if (state === 'in')   return { label: '● LIVE  ' + desc, cls: 'status-live' };
    if (state === 'post') return { label: 'FINAL',            cls: 'status-final' };
    return { label: formatTimeET(event?.date) || 'TBD',       cls: 'status-pre' };
  }

  // ── Team logo ──────────────────────────────────────────────────────────
  function teamLogoHtml(c) {
    const src  = c?.team?.logo;
    const abbr = c?.team?.abbreviation || '?';
    if (src) return `<img class="team-logo" src="${src}" alt="${abbr}" onerror="this.style.display='none'">`;
    return `<div class="team-logo-placeholder">${abbr.slice(0,3)}</div>`;
  }

  // ── Game card ──────────────────────────────────────────────────────────
  function buildCard(event) {
    const comps = event?.competitions?.[0];
    if (!comps) return '';
    const competitors = comps?.competitors || [];
    const home = competitors.find(c => c.homeAway === 'home') || competitors[0];
    const away = competitors.find(c => c.homeAway === 'away') || competitors[1];
    const { label, cls } = statusLabel(event);
    const isPost = event?.status?.type?.state === 'post';
    const isLive = event?.status?.type?.state === 'in';

    function teamRow(c) {
      if (!c) return '';
      const rank     = c.curatedRank?.current <= 25 ? `#${c.curatedRank.current}` : '';
      const hasScore = isPost || isLive;
      const score    = hasScore ? (c.score ?? '—') : '';
      const win      = isPost && c.winner;
      return `
        <div class="team-row">
          <span class="team-rank">${rank}</span>
          ${teamLogoHtml(c)}
          <span class="team-name ${win ? 'winner' : ''}">${c.team?.displayName || 'TBD'}</span>
          <span class="score ${win ? 'winner' : ''} ${!hasScore ? 'no-score' : ''}">${score}</span>
        </div>`;
    }

    const venue = comps?.venue?.fullName
      ? `${comps.venue.fullName}${comps.venue.address?.city ? ', ' + comps.venue.address.city : ''}` : '';
    const note = comps?.notes?.[0]?.headline ? ` · ${comps.notes[0].headline}` : '';

    const broadcastSet = new Set();
    (comps?.broadcasts || []).forEach(b => (b.names || []).forEach(n => broadcastSet.add(n)));
    (comps?.geoBroadcasts || []).forEach(b => {
      const n = b.media?.shortName || b.media?.name;
      if (n) broadcastSet.add(n);
    });
    const STREAM_KW = ['espn+','peacock','paramount+','max','hulu','fubo','sling','youtube','amazon','apple','pluto','tubi','+'];
    const badges = [...broadcastSet].map(name => {
      const bCls = STREAM_KW.some(k => name.toLowerCase().includes(k)) ? 'stream' : 'tv';
      return `<span class="broadcast-badge ${bCls}">${name}</span>`;
    }).join('');

    return `
      <div class="game-card">
        <div class="game-status ${cls}">${label}</div>
        <div class="matchup">${teamRow(away)}${teamRow(home)}</div>
        ${badges ? `<div class="broadcast-row">${badges}</div>` : ''}
        <div class="game-detail">${venue}${note}</div>
      </div>`;
  }

  // ── Fetch one day ──────────────────────────────────────────────────────
  async function fetchDay(slug, yyyymmdd) {
    const res = await fetch(`${BASE}/${slug}/scoreboard?limit=300&dates=${yyyymmdd}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return (await res.json())?.events || [];
  }

  // ── Fetch full current week ────────────────────────────────────────────
  async function fetchWeek(slug) {
    const results = await Promise.all(weekDatesET().map(d => fetchDay(slug, d)));
    const seen = new Set();
    const events = [];
    for (const batch of results) {
      for (const e of batch) {
        if (!seen.has(e.id)) { seen.add(e.id); events.push(e); }
      }
    }
    events.sort((a, b) => new Date(a.date) - new Date(b.date));
    return events;
  }

  // ── Render: date-grouped list (Men's) ─────────────────────────────────
  function renderGrouped(id, events) {
    const el = document.getElementById(id);
    if (!el) return;
    if (!events.length) {
      el.innerHTML = '<div class="no-games">No games scheduled this week.</div>';
      return;
    }
    const today = todayET();
    let html = '', lastDate = '';
    for (const e of events) {
      const d = dateET(e.date);
      if (d !== lastDate) {
        lastDate = d;
        const label = new Date(d + 'T12:00:00').toLocaleDateString('en-US', {
          weekday: 'long', month: 'short', day: 'numeric'
        });
        html += `<div class="date-divider ${d === today ? 'today' : ''}">${label}</div>`;
      }
      html += buildCard(e);
    }
    el.innerHTML = html;
  }

  // ── Render: Women's split (upcoming vs completed) ─────────────────────
  function renderWomensSplit(events) {
    const today    = todayET();
    const upcoming  = events.filter(e => e?.status?.type?.state === 'pre');
    const live      = events.filter(e => e?.status?.type?.state === 'in');
    const completed = events.filter(e => e?.status?.type?.state === 'post').reverse(); // newest first

    function buildGrouped(list, emptyMsg) {
      if (!list.length) return `<div class="no-games">${emptyMsg}</div>`;
      let html = '', lastDate = '';
      for (const e of list) {
        const d = dateET(e.date);
        if (d !== lastDate) {
          lastDate = d;
          const label = new Date(d + 'T12:00:00').toLocaleDateString('en-US', {
            weekday: 'long', month: 'short', day: 'numeric'
          });
          html += `<div class="date-divider ${d === today ? 'today' : ''}">${label}</div>`;
        }
        html += buildCard(e);
      }
      return html;
    }

    document.getElementById('womens-upcoming').innerHTML =
      buildGrouped(upcoming,  'No upcoming games this week.');
    document.getElementById('womens-live').innerHTML =
      buildGrouped(live,      'No games in progress.');
    document.getElementById('womens-completed').innerHTML =
      buildGrouped(completed, 'No completed games this week.');
  }

  // ── Load everything ────────────────────────────────────────────────────
  async function loadAll() {
    const [mensEvents, womensEvents] = await Promise.allSettled([
      fetchWeek('mens-college-volleyball'),
      fetchWeek('womens-college-volleyball'),
    ]);

    if (mensEvents.status === 'fulfilled') {
      renderGrouped('mens-games', mensEvents.value);
    } else {
      document.getElementById('mens-games').innerHTML =
        `<div class="error-msg">Could not load data (${mensEvents.reason?.message}).</div>`;
    }

    if (womensEvents.status === 'fulfilled') {
      renderWomensSplit(womensEvents.value);
    } else {
      ['womens-upcoming','womens-live','womens-completed'].forEach(id => {
        document.getElementById(id).innerHTML =
          `<div class="error-msg">Could not load data (${womensEvents.reason?.message}).</div>`;
      });
    }

    const now = new Date().toLocaleTimeString('en-US', {
      timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit', hour12: true
    });
    document.getElementById('refresh-bar').textContent =
      `Last updated ${now} ET · Auto-refreshing every 60 s`;
  }

  // ── Init ───────────────────────────────────────────────────────────────
  updateClock();
  setInterval(updateClock, 1000);
  loadAll();
  setInterval(loadAll, 60000);
</script>
</body>
</html>
